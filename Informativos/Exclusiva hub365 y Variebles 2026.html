<style>
:root, body {

  /* Fondos */

    --bg-s-d: #2b1f1c;
    --bg-p-l: #f9f7f4;
    --bg-s-l: #EFDFD6;
    --fondo-menu-expandible: var(--bg-p-l);

    --brandboards-color_primary: var(--primary-color-custom);
    --brandboards-color_secondary: var(--secondary-color-custom);
    --brandboards-color_accent: var(--accent-color-custom);

    --size-h2-2: clamp(34px,4vw,50px);
