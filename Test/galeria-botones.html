<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Galería: todos los botones de prueba juntos</title>
<style>
/* Vars de respaldo solo para probar este archivo suelto (fuera de la web real,
   que ya trae abdiel-css.css con estas mismas variables declaradas). */
:root {
  --bg-p-l: #f2f0ee;
  --bg-s-l: #e7e4ea;
  --bg-p-d: #141211;
  --bg-s-d: #252525;
  --text-d: #141211;
  --text-l: #fdfdfd;
  --white: #ffffff;
  --black: #000000;
  --contentfont: 'Nunito Sans', system-ui, sans-serif;
  --radius-element: 50px;
  --padding-btn: 18px 44px;
  --size-font-btn: clamp(16px, 19.22px - 0.32vw, 18px);
}

.v-dark {
  --text-d: var(--text-l);
  --bg-p-l: var(--bg-p-d);
  --bg-s-l: var(--bg-s-d);
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #999;
}

.seccion {
  padding: 20px 20px 0;
}
.seccion h1 {
  color: #fff;
  font-size: 16px;
  margin: 0 0 12px;
  text-align: center;
  opacity: .85;
}

.fila {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
  padding-bottom: 20px;
}

.demo-fondo {
  padding: 60px;
  border-radius: 20px;
  background: var(--bg-p-l);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   1) .btn-3d — botón presionable con borde y sombra sólida
   ============================================================ */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: transparent !important;
  border: 2px solid var(--text-d) !important;
  border-radius: var(--radius-element, 50px) !important;
  padding: var(--padding-btn, 18px 44px) !important;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0px 12px 1px var(--text-d, #141211) !important;
  transition: all 200ms;
  transform: translateY(0px);
}
.btn-3d :is(.main-heading-button, .button-icon-end) {
  color: var(--text-d) !important;
  font-family: var(--contentfont);
  font-size: var(--size-font-btn, 18px);
  letter-spacing: 1px;
}
.btn-3d:hover {
  transform: translateY(4px);
  box-shadow: 0px 9px 1px var(--text-d, #141211) !important;
}
.btn-3d:active {
  transform: translateY(12px);
  box-shadow: 0 0 0 !important;
}

/* ============================================================
   2) .btn-neumorfismo — relieve suave con doble sombra
   ============================================================ */
.demo-neumorfismo {
  --radius-element: 30px;
  --padding-btn: 24px 48px;
}
:is([data-theme="dark"], .modo-dark, .cont-color-d:hover, .v-dark) .btn-neumorfismo,
.btn-neumorfismo:is([data-theme="dark"], .modo-dark, .cont-color-d:hover, .v-dark) {
  --neu-sombra: color-mix(in srgb, var(--bg-p-l) 70%, var(--black) 30%);
  --neu-brillo: color-mix(in srgb, var(--bg-p-l) 96%, var(--white) 4%);
}
.btn-neumorfismo {
  --neu-sombra: color-mix(in srgb, var(--bg-p-l) 85%, var(--black) 15%);
  --neu-brillo: color-mix(in srgb, var(--bg-p-l) 90%, var(--white) 10%);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: color-mix(in srgb, var(--bg-p-l) 96%, black 4%) !important;
  text-decoration: none;
  border-radius: var(--radius-element, 30px) !important;
  padding: var(--padding-btn, 24px 48px) !important;
  border: none !important;
  box-shadow:
    12px 12px 16px 0 var(--neu-sombra),
    -12px -12px 16px 0 var(--neu-brillo),
    inset 0 0 0 0 transparent;
  transition: box-shadow 200ms, transform 300ms cubic-bezier(.2, 2, 1, 1);
  cursor: pointer;
}
.btn-neumorfismo::before {
  content: "";
  position: absolute;
  top: -1px; right: -1px; bottom: -1px; left: -1px;
  background: linear-gradient(to bottom, var(--neu-brillo), var(--neu-sombra));
  z-index: -1;
  border-radius: inherit;
}
.btn-neumorfismo :is(.main-heading-button, .button-icon-end) {
  color: var(--text-d) !important;
  font-family: var(--contentfont);
  font-size: var(--size-font-btn, 24px);
  letter-spacing: 2px;
}
.btn-neumorfismo:hover :is(.main-heading-button, .button-icon-end) {
  color: color-mix(in srgb, var(--text-d) 75%, transparent) !important;
}
.btn-neumorfismo:active {
  box-shadow:
    0 0 0 transparent,
    0 0 0 transparent,
    inset 8px 8px 12px 0 color-mix(in srgb, var(--neu-sombra) 90%, transparent),
    inset -8px -8px 12px 0 color-mix(in srgb, var(--neu-brillo) 90%, transparent);
  transform: scale(.99);
}

/* ============================================================
   3) .btn-discreto — pill oscuro/claro con degradado sutil
   ============================================================ */
.demo-discreto {
  --radius-element: 9999px;
  --padding-btn: 15px 40px;
  --size-font-btn: 16px;
}
.btn-discreto {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: var(--padding-btn, 1rem 2rem) !important;
  border-radius: var(--radius-element, 9999px) !important;
  background: linear-gradient(
      to bottom,
      var(--bg-p-l),
      color-mix(in srgb, var(--bg-p-l) 85%, var(--text-d) 15%)
  );
  border: 1px solid color-mix(in srgb, var(--bg-p-l) 80%, var(--text-d) 20%);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .5), 0 10px 20px rgba(0, 0, 0, .15) !important;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}
.btn-discreto :is(.main-heading-button, .button-icon-end) {
  color: var(--text-d) !important;
  font-weight: bold;
  font-size: var(--size-font-btn, 1.1rem);
}
.btn-discreto:hover {
  box-shadow: 0 2px 6px rgba(0, 0, 0, .6), 0 12px 24px rgba(0, 0, 0, .2) !important;
}
.btn-discreto:active {
  transform: translateY(2px);
  box-shadow: 0 1px 2px rgb(0 0 0 / 32%), 0 3px 4px rgba(0, 0, 0, 0.4) !important
}

/* ============================================================
   4) .btn-3d-discreto — bloque grueso con "escalones" de sombra
   ============================================================ */
.btn-3d-discreto {
  --st1: color-mix(in srgb, var(--bg-p-l) 98%, var(--white) 2%);
  --st2: color-mix(in srgb, var(--bg-p-l) 96%, var(--black) 4%);
  --st3: color-mix(in srgb, var(--bg-p-l) 92%, var(--black) 8%);
  --st4: color-mix(in srgb, var(--bg-p-l) 85%, var(--black) 15%);
  --st5: color-mix(in srgb, var(--bg-p-l) 80%, var(--black) 20%);
  --st6: color-mix(in srgb, var(--bg-p-l) 75%, var(--black) 25%);
  --st7: color-mix(in srgb, var(--bg-p-l) 65%, var(--black) 35%);
  --st8: color-mix(in srgb, var(--bg-p-l) 70%, var(--black) 30%);

  font: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-p-l);
  border: 0;
  color: var(--text-d);
  border-radius: var(--radius-element, 0.5em) !important;
  font-size: var(--size-font-btn, 1.35rem);
  padding: var(--padding-btn, 0.375em 1em) !important;
  font-weight: 600;
  text-decoration: none;
  text-shadow: 0 0.0625em 0 color-mix(in srgb, var(--bg-p-l) 98%, var(--white) 2%);
  box-shadow:
    inset 0 0.0625em 0 0 var(--st1),
    0 0.0625em 0 0 var(--st2),
    0 0.125em 0 0 var(--st3),
    0 0.25em 0 0 var(--st4),
    0 0.3125em 0 0 var(--st5),
    0 0.375em 0 0 var(--st6),
    0 0.425em 0 0 var(--st7),
    0 0.425em 0.5em 0 var(--st8);
  transition: 0.15s ease;
  cursor: pointer;
}
.btn-3d-discreto :is(.main-heading-button, .button-icon-end) {
  color: var(--text-d) !important;
  font-weight: 600;
}


.btn-3d-discreto:active {
  translate: 0 0.225em;
  box-shadow:
    inset 0 0.03em 0 0 var(--st1),
    0 0.03em 0 0 var(--st2),
    0 0.0625em 0 0 var(--st3),
    0 0.125em 0 0 var(--st4),
    0 0.125em 0 0 var(--st5),
    0 0.2em 0 0 var(--st6),
    0 0.225em 0 0 var(--st7),
    0 0.225em 0.375em 0 var(--st8);
}
</style>
</head>
<body>

<div class="seccion">
  <h1>1) .btn-3d</h1>
  <div class="fila">
    <div class="demo-fondo">
      <a href="#" class="btn-3d"><span class="main-heading-button">botón 3D</span></a>
    </div>
    <div class="demo-fondo v-dark">
      <a href="#" class="btn-3d"><span class="main-heading-button">botón 3D</span></a>
    </div>
  </div>
</div>

<div class="seccion">
  <h1>2) .btn-neumorfismo</h1>
  <div class="fila">
    <div class="demo-fondo demo-neumorfismo">
      <a href="#" class="btn-neumorfismo"><span class="main-heading-button">Botón Neumorfismo</span></a>
    </div>
    <div class="demo-fondo demo-neumorfismo v-dark">
      <a href="#" class="btn-neumorfismo"><span class="main-heading-button">Botón Neumorfismo</span></a>
    </div>
  </div>
</div>

<div class="seccion">
  <h1>3) .btn-discreto</h1>
  <div class="fila">
    <div class="demo-fondo demo-discreto">
      <a href="#" class="btn-discreto"><span class="main-heading-button">Register Now</span></a>
    </div>
    <div class="demo-fondo demo-discreto v-dark">
      <a href="#" class="btn-discreto"><span class="main-heading-button">Register Now</span></a>
    </div>
  </div>
</div>

<div class="seccion">
  <h1>4) .btn-3d-discreto</h1>
  <div class="fila">
    <div class="demo-fondo">
      <a href="#" class="btn-3d-discreto"><span class="main-heading-button">Register Now</span></a>
    </div>
    <div class="demo-fondo v-dark">
      <a href="#" class="btn-3d-discreto"><span class="main-heading-button">Register Now</span></a>
    </div>
  </div>
</div>

</body>
</html>
