<div class="chat-ab">

  <img class="chat-ab-avatar" src="" alt="">
  <div class="chat-ab-burbuja">
    <div class="chat-ab-escribiendo">
      <span></span><span></span><span></span>
    </div>
    <div class="chat-ab-mensaje">
      <p class="chat-ab-nombre">Nombre</p>
      <p class="chat-ab-texto">Mensaje.</p>
      <span class="chat-ab-hora">ahora</span>
    </div>
  </div>
  
  <style>
    .chat-ab {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      font-family: var(--contentfont);
      width: 100%;
      opacity: 0;
      transform: translateY(10px);
    }

    .chat-ab-visible {
      animation: chat-ab-entrada .4s ease forwards;
    }

    @keyframes chat-ab-entrada {
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-ab-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }

    .chat-ab-burbuja {
      box-sizing: border-box;
      border-radius: var(--radius-principal, 20px);
      padding: 12px 16px;
      width: fit-content;
      background: color-mix(in srgb, var(--bg-s-l) 98%, white 2%);
      color: var(--text-d);
      border-top: 1px solid color-mix(in srgb, var(--text-d) 9%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--text-d) 9%, transparent);
    }

    .chat-ab-activo .chat-ab-burbuja {
      width: 100%;
    }

    .chat-ab-escribiendo {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 4px;
      height: 18px;
    }

    .chat-ab-escribiendo span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: .4;
      animation: chat-ab-rebote 1.2s infinite ease-in-out;
    }
    .chat-ab-escribiendo span:nth-child(2) { animation-delay: .15s; }
    .chat-ab-escribiendo span:nth-child(3) { animation-delay: .3s; }

    @keyframes chat-ab-rebote {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .chat-ab-mensaje {
      display: none;
    }

    .chat-ab-nombre {
      margin: 0 0 4px;
      font-family: var(--contentfont);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-color-custom);
    }

    .chat-ab-texto {
      margin: 0;
      font-family: var(--contentfont);
      font-size: 14px;
      line-height: 1.4;
    }

    .chat-ab-hora {
      display: block;
      margin-top: 6px;
      font-family: var(--contentfont);
      font-size: 11px;
      opacity: .55;
      text-align: right;
    }

    .chat-ab-activo .chat-ab-escribiendo { display: none; }
    .chat-ab-activo .chat-ab-mensaje {
      display: block;
      animation: chat-ab-revelar .35s ease;
    }

    @keyframes chat-ab-revelar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .chat-ab-visible { animation: none; opacity: 1; transform: none; }
      .chat-ab-escribiendo span { animation: none; opacity: .7; }
      .chat-ab-activo .chat-ab-mensaje { animation: none; }
    }
  </style>

  <script>
    document.querySelectorAll('.chat-ab').forEach(function (el) {
      var tEscribiendo;

      function reiniciar() {
        clearTimeout(tEscribiendo);
        el.classList.remove('chat-ab-visible', 'chat-ab-activo');
        void el.offsetWidth; /* fuerza reflow para poder re-disparar la animación de entrada */
      }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            reiniciar();
            el.classList.add('chat-ab-visible');
            tEscribiendo = setTimeout(function () {
              el.classList.add('chat-ab-activo');
            }, 1800);
          } else {
            reiniciar();
          }
        });
      }, { threshold: 0.3 });

      io.observe(el);
    });
  </script>
</div>
