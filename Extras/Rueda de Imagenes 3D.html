<!-- ============================================
     RUEDA DE IMÁGENES 3D (versión GHL) — lee las imágenes que YA
     existen dentro de la columna, sin crear ni mover ningún elemento
     (Vue/Nuxt rompe su árbol si movemos nodos que administra).

     Solo 1 clase necesaria, en la COLUMNA que tiene las imágenes:

       Sección
         Fila
           Columna (texto)        ← sin clase especial, intacta
           Columna (rueda)        ← clase: rueda-viewport
             Imagen 1
             Imagen 2
             Imagen 3...

     El propio wrapper interno que GHL ya genera dentro de la columna
     (el div "vertical inner") se usa automáticamente como el anillo que
     gira — no hace falta una segunda clase a mano.
     ============================================ -->
<style>
/* GHL le pone "entrance animation" (data-entrance-clip) a la Columna que
   hace que se deslice al entrar en pantalla — esa animación mueve el
   transform del propio elemento y compite con el nuestro, causando que
   todo el conjunto "derive" de lugar. Se anula por completo aquí. */
.rueda-viewport {
  position: relative;
  perspective: 1400px;
  overflow: visible;
  min-height: 420px;
  animation: none !important;
  transition: none !important;
  transform: none !important;
}

/* El wrapper interno nativo de la columna ("vertical inner") se convierte
   en el anillo 3D: se neutraliza su layout por defecto (flex/stack) y se
   ancla con position:absolute (no flex) en el centro exacto del contenedor
   — dentro del editor de GHL, centrar con flex en una caja de 1x1px podía
   recalcularse en cada frame y hacer que el anillo "derivara" de lugar
   mientras giraba; con position:absolute el punto de anclaje queda fijo */
.rueda-viewport > .inner {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 1px !important;
  height: 1px !important;
  margin: 0 !important;
  flex: none !important;
  animation: none !important;
  transition: none !important;
  transform-style: preserve-3d;
  cursor: grab;
  touch-action: none;
}

.rueda-viewport > .inner.is-dragging {
  cursor: grabbing;
}

/* Se agrega vía JS al wrapper real de cada Imagen de GHL (.c-image) */
.rueda-tarjeta {
  position: absolute !important;
  top: 50%;
  left: 50%;
  width: 160px !important;
  height: 160px !important;
  max-width: none !important;
  max-height: none !important;
  margin: -80px 0 0 -80px;
  padding: 0 !important;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
  animation: none !important;
  transition: none !important;
  transform: rotateY(calc(var(--i) * (360deg / var(--rueda-count)))) translateZ(var(--rueda-radio, 320px));
}

/* Fuerza ancho/alto en TODOS los niveles intermedios de GHL (.image-container,
   divs envoltorios, <picture>) y anula cualquier max-width/max-height o padding
   que el editor de GHL les ponga según el tamaño configurado de la Imagen —
   max-width siempre le gana a width, así que sin esto la imagen se ve diminuta
   dentro del editor aunque funcione perfecto al abrir el archivo suelto */
.rueda-tarjeta * {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
}

.rueda-tarjeta img {
  object-fit: cover !important;
  pointer-events: none;
}

@media (max-width: 768px) {
  .rueda-viewport { min-height: 300px; }
  .rueda-tarjeta { width: 110px !important; height: 110px !important; margin: -55px 0 0 -55px; }
}
</style>

<script>
(function () {
  'use strict';

  var RADIO_MAX = 320;                // tope de ancho del círculo en contenedores anchos (px)
  var VELOCIDAD_BASE = 0.045;         // grados por frame cuando nadie interactúa
  var SENSIBILIDAD_ARRASTRE = 0.35;   // grados por px arrastrado
  var reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function initRueda(ring, viewport) {
    /* Busca las imágenes que YA están dentro de la columna — no crea nada nuevo */
    var imgs = ring.querySelectorAll('img');
    if (!imgs.length) return;

    /* El radio se calcula según el ancho REAL de la columna, no un número fijo:
       si la columna comparte sección con otra (ej. una de texto al lado), es
       mucho más angosta que el radio fijo de 320px, y las tarjetas que llegan
       a su punto más ancho del círculo se salen del contenedor. 90 ≈ la mitad
       del ancho de tarjeta (160/2) + un margen, para que quepa completa. */
    function actualizarRadio() {
      var ancho = viewport.clientWidth || 600;
      var radio = Math.max(70, Math.min(RADIO_MAX, ancho / 2 - 90));
      ring.style.setProperty('--rueda-radio', radio + 'px');
    }
    actualizarRadio();
    window.addEventListener('resize', actualizarRadio);

    ring.style.setProperty('--rueda-count', imgs.length);

    var cards = [];
    imgs.forEach(function (img, i) {
      /* El wrapper que GHL genera para cada Imagen es .c-image — es a ESE
         contenedor al que le damos la posición 3D, no al <img> directo */
      var card = img.closest('.c-image') || img.parentElement;
      card.classList.add('rueda-tarjeta');
      card.style.setProperty('--i', i);
      cards.push(card);
    });

    var angulo = 0;
    var impulso = 0;
    var arrastrando = false;
    var puntoXInicial = 0, anguloInicial = 0, ultimoX = 0, ultimoTiempo = 0, velocidadArrastre = 0;

    function aplicarProfundidad() {
      var paso = 360 / cards.length;
      cards.forEach(function (card, i) {
        var anguloActual = ((i * paso + angulo) % 360 + 360) % 360;
        var profundidad = Math.cos(anguloActual * Math.PI / 180);
        var desenfoque = (1 - profundidad) * 1.6;
        var opacidad = 0.55 + 0.45 * ((profundidad + 1) / 2);
        card.style.filter = 'blur(' + desenfoque.toFixed(2) + 'px)';
        card.style.opacity = opacidad.toFixed(2);
      });
    }

    function render() {
      if (!arrastrando) {
        if (!reducirMovimiento) angulo += VELOCIDAD_BASE + impulso;
        impulso *= 0.94;
      }
      ring.style.transform = 'rotate(-12deg) rotateY(' + angulo + 'deg)';
      aplicarProfundidad();
      requestAnimationFrame(render);
    }

    function onPointerDown(e) {
      arrastrando = true;
      ring.classList.add('is-dragging');
      puntoXInicial = e.clientX;
      anguloInicial = angulo;
      ultimoX = e.clientX;
      ultimoTiempo = performance.now();
      velocidadArrastre = 0;
      ring.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!arrastrando) return;
      var dx = e.clientX - puntoXInicial;
      angulo = anguloInicial + dx * SENSIBILIDAD_ARRASTRE;
      var ahora = performance.now();
      var dt = ahora - ultimoTiempo;
      if (dt > 0) velocidadArrastre = ((e.clientX - ultimoX) * SENSIBILIDAD_ARRASTRE) / dt * 16;
      ultimoX = e.clientX;
      ultimoTiempo = ahora;
    }

    function onPointerUp(e) {
      if (!arrastrando) return;
      arrastrando = false;
      ring.classList.remove('is-dragging');
      impulso = velocidadArrastre;
      try { ring.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    ring.addEventListener('pointerdown', onPointerDown);
    ring.addEventListener('pointermove', onPointerMove);
    ring.addEventListener('pointerup', onPointerUp);
    ring.addEventListener('pointercancel', onPointerUp);

    var scrollAnterior = window.scrollY;
    window.addEventListener('scroll', function () {
      var delta = window.scrollY - scrollAnterior;
      scrollAnterior = window.scrollY;
      impulso += Math.max(Math.min(delta * 0.012, 0.8), -0.8);
    }, { passive: true });

    requestAnimationFrame(render);
  }

  document.querySelectorAll('.rueda-viewport').forEach(function (viewport) {
    var ring = viewport.querySelector(':scope > .inner');
    if (ring) initRueda(ring, viewport);
  });
})();
</script>
