<style>
.borde-glass-neon {
  --border: 1px;
  --border-color: hsl(from var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088)) h 12% 20%);
  --radius-neon: var(--radius-principal, 22px);
  --radius-glow-calc: clamp(16px, var(--radius-neon), 26px);

  position: relative;
  overflow: visible;
  border-radius: var(--radius-neon);
  border: var(--border) solid var(--border-color);
  backdrop-filter: blur(12px);
  box-shadow:
    hsl(from var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088)) h 50% 2%) 0px 10px 16px -8px,
    hsl(from var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088)) h 50% 4%) 0px 20px 36px -14px;
}

.bgn-shine {
  pointer-events: none;
  border-radius: 0;
  border-top-right-radius: inherit;
  border-bottom-left-radius: inherit;
  border: 1px solid transparent;
  width: var(--glow-size, 180px);
  height: var(--glow-size, 180px);
  min-height: 0px;
  display: block;
  position: absolute;
  right: calc(var(--border) * -1);
  top: calc(var(--border) * -1);
  left: auto;
  z-index: 1;
  --start: 12%;
  background: conic-gradient(
    from var(--conic, -45deg) at center in oklch,
    transparent var(--start, 0%), hsl(from var(--color) h var(--sat, 80%) var(--lit, 60%)), transparent var(--end, 50%)
  ) border-box;
  mask: linear-gradient(transparent), linear-gradient(black);
  mask-repeat: no-repeat;
  mask-clip: padding-box, border-box;
  mask-composite: subtract;
}

.bgn-shine { --color: var(--glass-neon-color-1, var(--accent-color-custom, #dd8448)); }

.bgn-shine-bottom {
  --color: var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088));
  --conic: 135deg;
  top: auto;
  bottom: calc(var(--border) * -1);
  left: calc(var(--border) * -1);
  right: auto;
}

.bgn-glow {
  pointer-events: none;
  border-top-right-radius: calc(var(--radius-glow-calc) * 2.5);
  border-bottom-left-radius: calc(var(--radius-glow-calc) * 2.5);
  border: calc(var(--radius-glow-calc) * 1.25) solid transparent;
  top: calc(var(--radius-glow-calc) * -2);
  right: calc(var(--radius-glow-calc) * -2);
  width: var(--glow-size, 180px);
  height: var(--glow-size, 180px);
  min-height: 0px;
  display: block;
  position: absolute;
  left: auto;
  bottom: auto;
  --color: var(--glass-neon-color-1, var(--accent-color-custom, #dd8448));
  opacity: 1;
  filter: blur(12px) saturate(1.25) brightness(0.5);
  mix-blend-mode: plus-lighter;
  z-index: 3;
}

.bgn-glow::before,
.bgn-glow::after {
  content: "";
  position: absolute;
  inset: 0;
  border: inherit;
  border-radius: inherit;
  background: conic-gradient(
    from var(--conic, -45deg) at center in oklch,
    transparent var(--start, 0%), hsl(from var(--color) h var(--sat, 95%) var(--lit, 60%)), transparent var(--end, 50%)
  ) border-box;
  mask: linear-gradient(transparent), linear-gradient(black);
  mask-repeat: no-repeat;
  mask-clip: padding-box, border-box;
  mask-composite: subtract;
  filter: saturate(2) brightness(1);
}

.bgn-glow::after {
  --lit: 70%;
  --sat: 100%;
  --start: 15%;
  --end: 35%;
  border-width: calc(var(--radius-glow-calc) * 1.75);
  border-radius: calc(var(--radius-glow-calc) * 2.75);
  inset: calc(var(--radius-glow-calc) * -0.25);
  z-index: 4;
  opacity: 0.75;
}

.bgn-glow-bottom {
  --color: var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088));
  --conic: 135deg;
  inset: calc(var(--radius-glow-calc) * -2);
  top: auto;
  right: auto;
}

.bgn-glow-bright {
  --color: var(--glass-neon-color-1, var(--accent-color-custom, #dd8448));
  --lit: 80%;
  --sat: 100%;
  --start: 13%;
  --end: 37%;
  border-width: 5px;
  border-radius: calc(var(--radius-neon) + 2px);
  inset: -7px;
  left: auto;
  filter: blur(2px) brightness(0.66);
}

.bgn-glow-bright::after {
  content: none;
}

.bgn-glow-bright.bgn-glow-bottom {
  --color: var(--glass-neon-color-2, var(--accent-color-custom-2, #f0b088));
  inset: -7px;
  right: auto;
  top: auto;
}
</style>

<script>
(function () {
  function tieneCapasNeon(el) {
    return el.querySelector(':scope > .bgn-shine, :scope > .bgn-glow') !== null;
  }

  function construirCapasNeon(el) {
    var lado = Math.min(el.offsetWidth, el.offsetHeight);
    var tamanoGlow = Math.max(60, Math.round(Math.min(180, lado * 0.9)));
    el.style.setProperty('--glow-size', tamanoGlow + 'px');

    var capas = [
      'bgn-shine',
      'bgn-shine bgn-shine-bottom',
      'bgn-glow',
      'bgn-glow bgn-glow-bottom',
      'bgn-glow bgn-glow-bright',
      'bgn-glow bgn-glow-bright bgn-glow-bottom'
    ];
    capas.forEach(function (clases) {
      var span = document.createElement('span');
      span.className = clases;
      el.appendChild(span);
    });
  }

  function armarGlassNeon(el) {
    if (!tieneCapasNeon(el)) construirCapasNeon(el);

    if (!el.dataset.neonObserved) {
      el.dataset.neonObserved = 'true';
      new MutationObserver(function () {
        if (!tieneCapasNeon(el)) construirCapasNeon(el);
      }).observe(el, { childList: true });
    }
  }

  function init() {
    document.querySelectorAll('.borde-glass-neon').forEach(armarGlassNeon);
  }

  init();
  var intentos = 0;
  var intervalo = setInterval(function () {
    intentos++;
    init();
    if (intentos > 20) clearInterval(intervalo);
  }, 300);
})();
</script>
